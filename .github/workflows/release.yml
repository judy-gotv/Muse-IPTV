# Muse-IPTV Release：打 tag v* 即全架构打包
# 作者: Passwd Word
# 架构（6 个包）：linux x86_64 / aarch64 / armv7、macOS x86_64 / arm64、windows x86_64
# 每个包：iptv-api + iptv-worker + iptv-portal + iptv-admin + iptv-gateway + README + .env.example
# 另附 SHA256SUMS。Docker 多架构镜像见 docker.yml。
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.target }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            pkg_os: linux
            pkg_arch: x86_64
          - os: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            pkg_os: linux
            pkg_arch: aarch64
            cross_gcc: aarch64-linux-gnu-gcc
            apt: gcc-aarch64-linux-gnu
            deb_arch: arm64
            triple: aarch64-linux-gnu
          - os: ubuntu-22.04
            target: armv7-unknown-linux-gnueabihf
            pkg_os: linux
            pkg_arch: armv7
            cross_gcc: arm-linux-gnueabihf-gcc
            apt: gcc-arm-linux-gnueabihf
            deb_arch: armhf
            triple: arm-linux-gnueabihf
          - os: macos-15
            target: x86_64-apple-darwin
            pkg_os: macos
            pkg_arch: x86_64
          - os: macos-15
            target: aarch64-apple-darwin
            pkg_os: macos
            pkg_arch: aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            pkg_os: windows
            pkg_arch: x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.100"
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      # B4：hydrate 产物——wasm 目标 + cargo-leptos（leptos 0.8 对应 0.3.x）。
      # 没有这一步，shell 引用的 /pkg/*.js 全是 404，语言切换与全部 WASM
      # 交互都是死的（v0.1.1 现场复现）；输出名见各包 Cargo.toml 的
      # [package.metadata.leptos]。
      # 工具链须 ≥1.97：cargo-leptos 0.3.12 的传递依赖（cargo-util-schemas
      # 0.14.3 要 1.97、kstring 2.0.5 要 1.96）在 rustc 1.89 下编译失败
      # exit 101（v0.1.2 首建全红）；--locked 锁定其发布时 Cargo.lock，
      # 避免日后依赖再抬 MSRV 又红。工具链版本见 rust-toolchain.toml。
      - name: install cargo-leptos + wasm target
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install cargo-leptos --version "=0.3.12" --locked
      - name: install cross toolchain (linux)
        if: matrix.apt != ''
        run: |
          # 交叉编译要目标平台的 OpenSSL（openssl-sys 构建脚本在宿主上找不到
          # arm64/armhf 的 libssl 就会 exit 101；2026-11-25 Release 实测）。
          # 装 multiarch 的 libssl-dev，并把目标平台的 pkg-config 写进
          # GITHUB_ENV，后续 build 步骤用它定位目标 OpenSSL。
          # 注意：jammy 的 archive/security 源没有 armhf/arm64 索引，单加
          # dpkg --add-architecture 后 apt-get update 会 404 exit 100
          # （第 1 轮 d1c9493 两个交叉 job 均死于此，build 步骤 0s 跳过）。
          # 须先把现有源限定为 amd64，再加 ports.ubuntu.com 的目标架构源。
          # 第 2 轮只改了 /etc/apt/sources.list：security.ubuntu.com 的源在
          # /etc/apt/sources.list.d/ubuntu.sources（deb822 格式），没被覆盖，
          # apt 仍向它要 arm64/armhf 索引，404 exit 100（Release 45516397484
          # 实测：ports 源全 Get 成功，404 全在 security.ubuntu.com）。
          # 第 3 轮的 deb822 补丁仍未生效（Release 45521063297 实测）：
          # 字符串 replace 会写坏 "Types: deb deb-src" 行，且已有
          # Architectures 字段的 stanza 会被 guard 直接跳过。
          # 第 4 轮：同一段 Python 按格式分别处理——one-line 源解析
          # [options] 后限定 arch=amd64；deb822 按 stanza 处理，已有
          # Architectures 就改写为 amd64，缺失则在 Types 行后插入；
          # 改前改后都打印全部源文件，日志里留证据。
          # 第 5 轮：apt-get update 已通（第 4 轮 ports 修复生效，无 404），
          # 死在 apt-get install：pkg-config-aarch64-linux-gnu /
          # pkg-config-arm-linux-gnueabihf 在 jammy 里不存在（Release
          # 45543091514 实测 E: Unable to locate package）。这两个包名
          # 本来就不存在——交叉 pkg-config 包装器不是单独的包，而是
          # pkg-config 本包自带的 dpkg hook 生成的：jammy 的 pkg-config
          # 文件清单含 /usr/share/pkg-config-crosswrapper、
          # /usr/share/pkg-config-dpkghook 与
          # /etc/dpkg/dpkg.cfg.d/pkg-config-hook-config，装交叉 gcc 后
          # hook 自动建 /usr/bin/<triplet>-pkg-config 软链。故 install
          # 只装 pkg-config（amd64 本包），删 pkg-config-${triple}。
          sudo dpkg --add-architecture ${{ matrix.deb_arch }}
          echo '=== apt sources before ==='
          for f in /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            [ -f "$f" ] || continue
            echo "--- $f"
            cat "$f"
          done
          sudo python3 - <<'PY'
          import glob, re

          def limit_oneline(path):
              try:
                  with open(path) as fh:
                      lines = fh.read().splitlines()
              except FileNotFoundError:
                  return
              out = []
              for line in lines:
                  s = line.strip()
                  if not s or s.startswith("#"):
                      out.append(line)
                      continue
                  m = re.match(r"^(deb-src|deb)\s+(.*)$", s)
                  if not m:
                      out.append(line)
                      continue
                  kind, rest = m.groups()
                  tokens = rest.split()
                  if tokens and tokens[0].startswith("["):
                      j = 0
                      while j < len(tokens) and not tokens[j].endswith("]"):
                          j += 1
                      inner = " ".join(tokens[: j + 1])[1:-1].strip()
                      parts = [p for p in inner.split() if not p.startswith("arch=")]
                      parts.append("arch=amd64")
                      out.append(kind + " [" + " ".join(parts) + "] " + " ".join(tokens[j + 1:]))
                  else:
                      out.append(kind + " [arch=amd64] " + rest)
              with open(path, "w") as fh:
                  fh.write("\n".join(out) + ("\n" if out else ""))

          def limit_deb822(path):
              with open(path) as fh:
                  text = fh.read()
              stanzas = text.split("\n\n")
              out = []
              for st in stanzas:
                  if not st.strip():
                      out.append(st)
                      continue
                  lines = st.split("\n")
                  has_arch = any(l.startswith("Architectures:") for l in lines)
                  new_lines = []
                  for l in lines:
                      if l.startswith("Architectures:"):
                          new_lines.append("Architectures: amd64")
                      else:
                          new_lines.append(l)
                          if not has_arch and l.startswith("Types:"):
                              new_lines.append("Architectures: amd64")
                  out.append("\n".join(new_lines))
              with open(path, "w") as fh:
                  fh.write("\n\n".join(out))

          for f in ["/etc/apt/sources.list"] + sorted(glob.glob("/etc/apt/sources.list.d/*.list")):
              limit_oneline(f)
          for f in sorted(glob.glob("/etc/apt/sources.list.d/*.sources")):
              limit_deb822(f)
          print("apt sources limited to amd64")
          PY
          echo '=== apt sources after ==='
          for f in /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            [ -f "$f" ] || continue
            echo "--- $f"
            cat "$f"
          done
          for suite in jammy jammy-updates jammy-backports jammy-security; do
            echo "deb [arch=${{ matrix.deb_arch }}] http://ports.ubuntu.com/ubuntu-ports/ $suite main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list.d/ports-${{ matrix.deb_arch }}.list > /dev/null
          done
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.apt }} pkg-config libssl-dev:${{ matrix.deb_arch }}
          ls -l "/usr/bin/${{ matrix.triple }}-pkg-config" || echo "WARNING: cross pkg-config wrapper missing"
          echo "PKG_CONFIG=${{ matrix.triple }}-pkg-config" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_ALLOW_CROSS=1" >> "$GITHUB_ENV"
      - name: build
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.cross_gcc }}
          CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER: ${{ matrix.cross_gcc }}
        run: |
          # B4：先由 cargo-leptos 构建 portal/admin 的前端（target/site/pkg/）
          # 与服务端二进制（编译时烘入 LEPTOS_OUTPUT_NAME）；其余三个二进制
          # 走普通 cargo build。交叉 job（aarch64/armv7）的服务端目标不是
          # 宿主：cargo-leptos 只负责在宿主上产出前端 pkg/，服务端二进制用
          # 普通 cargo build + LEPTOS_OUTPUT_NAME 环境变量烘入输出名。
          if [ -n "${{ matrix.cross_gcc }}" ]; then
            cargo leptos build --release -p iptv-portal
            cargo leptos build --release -p iptv-admin
            LEPTOS_OUTPUT_NAME=iptv-portal cargo build --release --target ${{ matrix.target }} -p iptv-portal
            LEPTOS_OUTPUT_NAME=iptv-admin cargo build --release --target ${{ matrix.target }} -p iptv-admin
          else
            cargo leptos build --release -p iptv-portal
            cargo leptos build --release -p iptv-admin
          fi
          cargo build --release --target ${{ matrix.target }} -p iptv-api -p iptv-worker -p iptv-gateway
      - name: package (unix)
        if: matrix.pkg_os != 'windows'
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME}"
          PKG="muse-iptv-${VERSION}-${{ matrix.pkg_os }}-${{ matrix.pkg_arch }}"
          mkdir -p "$PKG"
          BIN="target/${{ matrix.target }}/release"
          cp "$BIN/iptv-api" "$BIN/iptv-worker" "$BIN/iptv-portal" "$BIN/iptv-admin" "$BIN/iptv-gateway" "$PKG/"
          cp README.md .env.example "$PKG/"
          # B4：前端 hydrate 产物（site/pkg/*.js），安装脚本拷到 $BIN_DIR/site
          # 并写 LEPTOS_SITE_ROOT 进 .env；没有它门户/后台只有 SSR。
          # 两项目各用各的 site-root（构建时互不清空），这里合并成一个 site/。
          mkdir -p "$PKG/site/pkg"
          cp target/site-portal/pkg/* target/site-admin/pkg/* "$PKG/site/pkg/"
          tar -czf "$PKG.tar.gz" "$PKG"
          sha256sum "$PKG.tar.gz" >> SHA256SUMS
          echo "PKG=$PKG.tar.gz" >> "$GITHUB_ENV"
      - name: package (windows)
        if: matrix.pkg_os == 'windows'
        shell: pwsh
        run: |
          $Version = "${{ github.ref_name }}"
          $Pkg = "muse-iptv-$Version-windows-x86_64"
          New-Item -ItemType Directory -Force -Path $Pkg | Out-Null
          $Bin = "target/${{ matrix.target }}/release"
          Copy-Item "$Bin/iptv-api.exe","$Bin/iptv-worker.exe","$Bin/iptv-portal.exe","$Bin/iptv-admin.exe","$Bin/iptv-gateway.exe" $Pkg
          Copy-Item README.md,.env.example $Pkg
          # B4：前端 hydrate 产物（site/pkg/*.js），安装脚本拷到 $InstallDir/site
          # 并写 LEPTOS_SITE_ROOT 进 .env；没有它门户/后台只有 SSR。
          # 两项目各用各的 site-root（构建时互不清空），这里合并成一个 site/。
          New-Item -ItemType Directory -Force -Path "$Pkg/site/pkg" | Out-Null
          Copy-Item target/site-portal/pkg/*,target/site-admin/pkg/* "$Pkg/site/pkg"
          Compress-Archive -Path $Pkg -DestinationPath "$Pkg.zip"
          (Get-FileHash -Algorithm SHA256 "$Pkg.zip").Hash.ToLower() + "  $Pkg.zip" | Out-File -Append -Encoding ascii SHA256SUMS
          echo "PKG=$Pkg.zip" >> $env:GITHUB_ENV
      - uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.pkg_os }}-${{ matrix.pkg_arch }}
          path: |
            muse-iptv-*.tar.gz
            muse-iptv-*.zip
            SHA256SUMS

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: pkg-*
          merge-multiple: true
      - name: merge SHA256SUMS
        run: |
          # 各 build job 的 SHA256SUMS 同名，下载时会互相覆盖，故在此按包文件重新计算汇总。
          ls -la muse-iptv-*
          sha256sum muse-iptv-*.tar.gz muse-iptv-*.zip > SHA256SUMS
          cat SHA256SUMS
      - name: create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Muse-IPTV ${{ github.ref_name }}
          body: |
            Muse-IPTV ${{ github.ref_name }} — 全 Rust IPTV 播放平台（开发文档 v1.2）。
            包含 6 个架构包（linux x86_64/aarch64/armv7、macOS x86_64/arm64、windows x86_64），每个包 5 个二进制：iptv-api / iptv-worker / iptv-portal / iptv-admin / iptv-gateway（单端口 :8081，门户 /、后台 /admin、API /api/* 与 /healthz 全走它）+ 前端 hydrate 产物 site/（/pkg/*.js，语言切换与全部 WASM 交互由此恢复，v0.1.2 修 B4）。
            一键安装：`curl -fsSL https://raw.githubusercontent.com/judy-gotv/Muse-IPTV/main/install.sh | sh`
            Windows：`irm https://raw.githubusercontent.com/judy-gotv/Muse-IPTV/main/install.ps1 | iex`
            Docker：`ghcr.io/judy-gotv/muse-iptv:${{ github.ref_name }}`（amd64/arm64）
          files: |
            muse-iptv-*.tar.gz
            muse-iptv-*.zip
            SHA256SUMS
