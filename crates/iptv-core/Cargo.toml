# 领域模型 + 业务规则（不依赖框架，§1.1/§3）
# 作者: Passwd Word
[package]
name = "iptv-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
iptv-dto = { path = "../iptv-dto" }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
hmac = { workspace = true }
rand = { workspace = true }
# B4：token.rs 用 rand::thread_rng()。WASM 构建里 rand 0.8 经 getrandom 0.2
# 取随机数，wasm32-unknown-unknown 上必须开 getrandom 的 js 特性（用
# Crypto.getRandomValues），否则编不过；宿主构建上该特性是惰性的。
getrandom = { workspace = true }
anyhow = { workspace = true }
# ssrf.rs 的异步 DNS 解析用 tokio（仅 lookup_host）；其余领域规则仍是纯函数。
tokio = { workspace = true }
url = { workspace = true }
# logo_store.rs 的台标下载 + S3 PUT 用 reqwest（§7.2，m9）。
# iptv-core 只被服务端 crate（iptv-api / iptv-store / iptv-worker）依赖，
# 不进 Leptos WASM 构建，故可直接依赖 reqwest。
reqwest = { workspace = true }
# logo_store.rs 的台标缩略图（m9）用 image：默认特性关闭，只开
# png/jpeg/gif（解码+编码同属这三个特性，无额外依赖；webp 解码
# 需另开 webp 特性，故 webp 只做魔数校验、不生成缩略图）。
# 工作区已定义同版本 image（iptv-api 在用，png/jpeg），这里补开 gif
# 特性；特性在全工作区统一生效，只新增 gif/color_quant 两个小 crate。
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif"] }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
