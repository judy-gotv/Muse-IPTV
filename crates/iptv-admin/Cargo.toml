# 管理后台 Leptos SSR + hydrate（§5）
# 作者: Passwd Word
[package]
name = "iptv-admin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
iptv-dto = { path = "../iptv-dto" }
iptv-i18n = { path = "../iptv-i18n" }
iptv-design = { path = "../iptv-design" }
iptv-ui = { path = "../iptv-ui" }
iptv-core = { path = "../iptv-core" }
leptos = { workspace = true }
leptos_meta = { workspace = true }
leptos_router = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
fluent-bundle = { workspace = true }
# B4：WASM 侧只用这三个（hydrate 入口 + 读 document.cookie / navigator.language）。
wasm-bindgen = { workspace = true }
web-sys = { workspace = true }
console_error_panic_hook = { workspace = true }
# B4：服务端专属依赖，只在 ssr 特性下启用。cargo-leptos 构建 WASM lib 时
# 只开 hydrate（+ --no-default-features），这些依赖不参与 wasm32 编译，
# 否则 reqwest（rustls）/ axum（hyper）/ tokio full 全都编不过。
# uuid 在本包未使用（v0.1.2 清理），reqwest 的 multipart 供 main.rs 的
# M3U 上传转发用。
reqwest = { workspace = true, features = ["multipart"], optional = true }
leptos_axum = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
dotenvy = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true }

# B4：cargo-leptos 要求 lib 是 cdylib（产 WASM）+ rlib（供服务端二进制与测试用）。
[lib]
crate-type = ["cdylib", "rlib"]

# B4：特性划分（cargo-leptos 0.3 默认：lib 构建 --no-default-features
# --features=hydrate；bin 构建 --no-default-features --features=ssr）。
# default = ["ssr"] 让普通 cargo build/clippy/test（CI）仍按服务端编译。
[features]
default = ["ssr"]
ssr = [
    "dep:axum",
    "dep:dotenvy",
    "dep:leptos_axum",
    "dep:reqwest",
    "dep:tokio",
    "dep:tracing",
    "dep:tracing-subscriber",
    "leptos/ssr",
    "leptos_meta/ssr",
    "leptos_router/ssr",
]
hydrate = ["leptos/hydrate"]

# B4：cargo-leptos 配置，见 crates/iptv-portal/Cargo.toml 同名段注释。
[package.metadata.leptos]
output-name = "iptv-admin"
# B4：cargo-leptos 默认两边都不开特性（--no-default-features 且特性列表为空），
# 必须显式配：lib（WASM）只开 hydrate（开 ssr 会让 #[server] 宏生成服务端体，
# 调 reqwest/axum 的 helper 编不过）；bin（服务端）只开 ssr。
bin-features = ["ssr"]
lib-features = ["hydrate"]
# B4：两个项目各用各的 site-root。cargo-leptos 每次构建都会清空整个
# site 根目录（build_proj 的 rm_dir_content），共享 target/site 时后构建
# 的项目会删掉先构建的 pkg/；打包时再把两边的 pkg/ 合并成一个 site/。
site-root = "target/site-admin"
