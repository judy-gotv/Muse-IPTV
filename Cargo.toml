# IPTV 播放平台 — 全 Rust 技术栈 (开发文档 v1.2, §1.1)
# 作者: Passwd Word
[workspace]
resolver = "2"
members = [
    "crates/iptv-core",
    "crates/iptv-dto",
    "crates/iptv-store",
    "crates/iptv-m3u",
    "crates/iptv-epg",
    "crates/iptv-auth",
    "crates/iptv-concurrency",
    "crates/iptv-i18n",
    "crates/iptv-design",
    "crates/iptv-api",
    "crates/iptv-worker",
    "crates/iptv-ui",
    "crates/iptv-portal",
    "crates/iptv-admin",
    "crates/iptv-gateway",
    # xtask 必须是成员，`cargo run -p xtask` / `cargo xtask` 才能解析到它
    # （只在 exclude 里时 -p 找不到包；xtask 无业务依赖，不影响主构建）。
    "xtask",
]
exclude = ["deploy/tauri-shell"]

[workspace.package]
version = "0.1.5"
edition = "2021"
rust-version = "1.85"
license = "MIT"
authors = ["Passwd Word"]
repository = "https://github.com/judy-gotv/Muse-IPTV"

[workspace.dependencies]
# --- async / web (§2) ---
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["macros", "multipart"] }
tower = { version = "0.5" }
tower-http = { version = "0.6", features = ["cors", "trace", "compression-gzip"] }
# m21：定时任务改 tokio-cron-scheduler（文档 §2 选型）；OpenAPI 改 utoipa 代码生成。
tokio-cron-scheduler = "0.15"
utoipa = { version = "5", features = ["axum_extras", "chrono"] }
# --- serde (§2) ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# --- db (§2, §10): SQLx Any — 同一套代码跑 PG / MySQL / SQLite, 只改 DATABASE_URL ---
sqlx = { version = "0.8", features = ["any", "postgres", "mysql", "sqlite", "runtime-tokio", "tls-rustls"] }
# m20：Repository trait 层（§10.4）用 async-trait，使 async 方法可作
# `Arc<dyn Trait>` 注入；原生 async fn in trait 无法 dyn（1.75+ 稳定的是
# RPITIT，不可对象安全）。0.1.92 已在 Cargo.lock（传递依赖），无新增下载。
async-trait = "0.1"
# --- crypto / auth (§2, §13) ---
argon2 = "0.5"
sha2 = "0.10"
sha1 = "0.10"
hmac = "0.12"
subtle = "2"
base64 = "0.22"
hex = "0.4"
rand = "0.8"
# B4：见 crates/iptv-core/Cargo.toml 注释（WASM 构建要 getrandom/js）。
getrandom = { version = "0.2", features = ["js"] }
uuid = { version = "1", features = ["v4"] }
# --- http client / parsing (§2) ---
reqwest = { version = "0.12", features = ["rustls-tls", "json", "stream"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
quick-xml = { version = "0.38", features = ["serialize"] }
# --- i18n (§2, §12) ---
fluent-bundle = "0.16"
unic-langid = { version = "0.9", features = ["serde"] }
# m15：ICU 等价实现——chrono-tz 做 IANA 时区换算（默认 Asia/Taipei，
# §12.9 三档时区测试），pinyin 做中文拼音排序（§12.9 排序测试）；
# 不引 icu4x（体积与编译成本过高，见 README §12 偏差说明）。
chrono-tz = "0.10"
pinyin = "0.10"
# --- observability / errors (§2) ---
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
thiserror = "2"
anyhow = "1"
chrono = { version = "0.4", features = ["serde", "clock"] }
# --- misc ---
dotenvy = "0.15"
redis = { version = "0.27", features = ["tokio-comp"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
qrcode = "0.14"
url = "2"
# B4：leptos 系依赖不要在这里开 ssr 特性——`#[server]` 宏经
# server_fn_macro 的 cfg!(feature = "ssr") 分流服务端体/客户端存根，
# 它看的是 leptos 自身的 ssr 特性；工作区全局开 ssr 会导致 WASM 构建
# 也生成服务端体（调 reqwest/axum 的 helper 全编不过）。ssr 由
# iptv-portal / iptv-admin 各自的 ssr 特性开启。
leptos = { version = "0.8" }
leptos_axum = { version = "0.8" }
leptos_meta = { version = "0.8" }
leptos_router = { version = "0.8" }
# B4：hydrate 入口与 WASM 侧 Cookie/语言读取（portal/admin 的 lib 用）。
wasm-bindgen = "0.2"
js-sys = "0.3"
# m16：播放器接 hls.js（MSE）需 HtmlMediaElement::can_play_type 与
# HtmlVideoElement（NodeRef<leptos::html::Video> 的 Output）。
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlDocument", "Navigator", "HtmlMediaElement", "HtmlVideoElement"] }
console_error_panic_hook = "0.1"

[profile.release]
lto = true
codegen-units = 1
